<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện tập Bộ chọn CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sẽ dùng Element selector (h1) -->
    <h1>Trang web của tôi</h1>

    <!-- Sẽ dùng Class selector (.description) -->
    <p class="description">Xin chào! Tôi là một người đam mê học lập trình web và thích khám phá những công nghệ mới để tạo ra các trang web thú vị.</p>

    <!-- Sẽ dùng Class selector và Pseudo-class (:nth-child) -->
    <ul class="hobbies-list">
        <li>Nghe nhạc</li>
        <li>Đọc sách</li>
        <li>Viết code</li>
    </ul>

    <!-- Sẽ dùng ID selector (#action-btn) và Pseudo-class (:hover) -->
    <button id="action-btn">Nhấn vào đây</button>

</body>
</html>
